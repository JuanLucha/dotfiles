# Windows with vi mode
set-window-option -g mode-keys vi

# Improve colors & TrueColor
set -g default-terminal 'tmux-256color'
set -ga terminal-overrides ",xterm-256color*:Tc,xterm*:Tc"
# Force tmux to interpret backspace correctly and not map Ctrl+h to it
set -as terminal-overrides ',*:kbs=\177'

# ---- Clipboard ----
# Apps (opencode, nvim, ...) write the system clipboard with OSC 52 wrapped in a
# tmux DCS passthrough sequence. tmux >= 3.4 defaults allow-passthrough to off and
# silently drops that sequence, while the app still claims "Copied to clipboard".
set -g allow-passthrough on
# Accept OSC 52 from apps and forward it to the outer terminal (ghostty).
set -g set-clipboard on

# More history
set -g history-limit 100000

# Less delay for ESC
set-option -sg escape-time 10

# Shift+Enter for new line (pass escape sequence to app)
bind-key -n S-Enter send-keys "\u001b[13;2u"

# Enabling focus events
set-option -g focus-events on

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Resize panes
bind-key -r -T prefix C-i resize-pane -U 5
bind-key -r -T prefix C-u resize-pane -D 5
bind-key -r -T prefix C-y resize-pane -L 5
bind-key -r -T prefix C-o resize-pane -R 5

# Renumber windows on close so no index gaps (0, 1, 2, ...)
set -g renumber-windows on
# Manual renumber of all windows in the session (in case gaps appear)
bind-key N move-window -r

# Reload tmux configuration
bind-key r source-file ~/.tmux.conf

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'olimorris/tmux-pomodoro-plus'

# Vim 'v' and 'y' commands while vi-mode
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# Pomodoro config
# status-right is set by the theme loader so it works with every theme
set -g @pomodoro_start 'p'                          # Start a Pomodoro with tmux-prefix + p
set -g @pomodoro_cancel 'P'                         # Cancel a Pomodoro with tmux-prefix key + P
set -g @pomodoro_mins 25                            # The duration of the pomodoro
set -g @pomodoro_break_mins 5                       # The duration of the break after the pomodoro
set -g @pomodoro_on " #[fg=$text_red]🍅 "           # The formatted output when the pomodoro is running
set -g @pomodoro_complete " #[fg=$text_green]🕹 "   # The formatted output when the break is running
set -g @pomodoro_notifications 'on'                 # Turn on/off desktop notifications
set -g @pomodoro_sound 'Pop'                        # Sound for desktop notifications (Run `ls /System/Library/Sounds` for a list of sounds to use)

# Enable mouse scroll
setw -g mouse on
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection

# Split horizontally in the same directory
bind '"' split-window -v -c "#{pane_current_path}"

# Split vertically in the same directory
bind % split-window -h -c "#{pane_current_path}"

# Create new windows (tabs) in the same directory
bind c new-window -c "#{pane_current_path}"

# ==========================================
# Themes (one file per theme in ~/.tmux/themes/)
# ==========================================
# Default is only set once so prefix + r and theme cycling preserve the choice
if-shell -F '#{?@theme,0,1}' 'set -g @theme cyberpunk'
source-file ~/.tmux/themes/load.tmux

# Cycle themes with prefix + T
bind-key T if-shell -F '#{==:#{@theme},cyberpunk}' \
  'set -g @theme halloween; source-file ~/.tmux/themes/load.tmux; display-message "Theme: Halloween 🎃"' \
  'set -g @theme cyberpunk; source-file ~/.tmux/themes/load.tmux; display-message "Theme: Cyberpunk 80s 🌃"'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# More info here https://github.com/tmux-plugins/tpm
run '~/.tmux/plugins/tpm/tpm'
